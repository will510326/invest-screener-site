<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>投資篩選儀表板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC',sans-serif;background:#0d1016;color:#e2e8f0;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#64748b;font-size:.78rem;margin:4px 0 14px}
.card{background:#161b26;border:1px solid #273244;border-radius:12px;padding:16px 18px;margin-bottom:16px}
h2{font-size:1.05rem;color:#93c5fd;margin-bottom:12px;padding-left:10px;border-left:3px solid #3b82f6;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:.92rem;color:#cbd5e1;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:#1e2a3d;color:#93c5fd;padding:7px 8px;text-align:left;border-bottom:2px solid #3b82f6;white-space:nowrap;position:sticky;top:0;z-index:2}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:#e2e8f0}
td{padding:6px 8px;border-bottom:1px solid #1e2636;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#1a2233}
.scroll{overflow:auto;max-height:560px;border:1px solid #1e2636;border-radius:8px}
.g{color:#4ade80;font-weight:600}.r{color:#f87171;font-weight:600}.y{color:#fbbf24;font-weight:600}.mut{color:#64748b}
ul{padding-left:18px;font-size:.84rem;color:#cbd5e1}li{margin:3px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#0d1016;border:1px solid #273244;border-radius:8px;padding:8px 12px}
.kpi .l{font-size:.74rem;color:#94a3b8}.kpi b{font-size:1.15rem;display:block}.kpi .d{font-size:.74rem;color:#94a3b8}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid #273244}
.tab{background:none;border:none;color:#94a3b8;padding:8px 14px;font-size:.88rem;cursor:pointer;border-bottom:2px solid transparent;margin:0}
.tab.on{color:#e2e8f0;border-bottom-color:#3b82f6}
.panel{display:none}.panel.on{display:block}
input,select{background:#0d1016;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:6px 8px;font-size:.84rem;width:100%}
label{font-size:.74rem;color:#94a3b8;display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
button{background:#2563eb;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.85rem;cursor:pointer;margin-top:12px}
button:hover{background:#1d4ed8}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.filters>div{min-width:150px}.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;color:#cbd5e1;cursor:pointer}
.chk input{width:auto}
.detail td{background:#10151f}
.detail .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;font-size:.8rem}
.verdict{margin-top:14px;padding:12px;border-radius:8px;font-size:.88rem}
.v-green{background:#0f2a18;border:1px solid #166534}.v-yellow{background:#2a2410;border:1px solid #78350f}.v-red{background:#2a1215;border:1px solid #7f1d1d}
.chart{background:#0d1016;border:1px solid #273244;border-radius:8px;padding:8px}
.chart .t{font-size:.82rem;color:#e2e8f0;margin:0 0 4px 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:#cbd5e1;margin:0 0 4px 4px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;border-radius:2px}
svg text{fill:#94a3b8;font-size:10px}
.news{border-bottom:1px solid #1e2636;padding:8px 0;font-size:.84rem;display:flex;gap:10px;align-items:flex-start}
.news .nb{flex:1;min-width:0;overflow-wrap:anywhere}
.news a{color:#93c5fd;text-decoration:none}.news a:hover{text-decoration:underline}
.news.s-new{border-left:3px solid #fbbf24;background:#1c1810;padding-left:9px;padding-right:6px}
.news.s-dismissed .nb{opacity:.6}
.news.g-next{margin-left:18px;border-bottom-style:dashed}
.pill.grp{background:#1e293b;color:#93c5fd;border:1px solid #334155}
.pill{display:inline-block;font-size:.72rem;line-height:1.5;padding:0 8px;border-radius:999px;border:1px solid #334155;color:#94a3b8;white-space:nowrap}
.pill.new{color:#fbbf24;border-color:#a16207;background:#2a2410;font-weight:600}.pill.confirmed{color:#4ade80;border-color:#166534}
button.copy{flex:none;margin:0;background:#1e293b;border:1px solid #334155;color:#cbd5e1;padding:6px 10px;font-size:.78rem;min-height:36px;white-space:nowrap}
button.copy:hover{background:#273449}button.copy.ok{color:#4ade80;border-color:#166534}button.copy.err{color:#fbbf24;border-color:#a16207}
.confirm{background:#0d1016;border:1px solid #273244;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.8rem;color:#cbd5e1}
.confirm a.edit{display:inline-flex;align-items:center;min-height:36px;background:#2563eb;color:#fff;text-decoration:none;border-radius:7px;padding:6px 14px;font-size:.84rem;margin:0 10px 6px 0}
.confirm a.edit:hover{background:#1d4ed8}
.crit{margin-top:8px;border-top:1px solid #273244;padding-top:6px}
.crit summary{cursor:pointer;color:#93c5fd;font-weight:600;padding:6px 0;min-height:32px}
.crit p{margin:6px 0}.crit h4{font-size:.84rem;color:#e2e8f0;margin:10px 0 2px}
.crit .grp{color:#fbbf24;margin:6px 0 0}.crit ul{font-size:.8rem;margin-bottom:4px}
.confirm code{background:#1e2a3d;border-radius:4px;padding:0 4px;font-size:.78rem}
@media (max-width:640px),(pointer:coarse){button.copy,.confirm a.edit{min-height:44px;padding:8px 12px}}
.foot{text-align:center;color:#475569;font-size:.7rem;margin-top:20px;padding-top:12px;border-top:1px solid #1e2636}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{background:#161b26;border:1px solid #273244;border-radius:14px;padding:28px;width:100%;max-width:360px}
#lock .err{color:#f87171;font-size:.82rem;min-height:1.2em;margin-top:8px}
#app{display:none}
.tip{position:fixed;pointer-events:none;background:#1e2a3d;border:1px solid #334155;border-radius:6px;padding:4px 8px;font-size:.75rem;color:#e2e8f0;display:none;z-index:9;white-space:nowrap}
.seg{display:inline-flex;border:1px solid #334155;border-radius:7px;overflow:hidden}
.seg button{background:none;color:#94a3b8;border:none;border-radius:0;padding:4px 10px;font-size:.78rem;margin:0}
.seg button+button{border-left:1px solid #334155}.seg button.on{background:#1e3a5f;color:#e2e8f0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fresh{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;background:#161b26;border:1px solid #273244;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.84rem}
.fresh b{font-size:1rem}.fresh .l{color:#94a3b8;font-size:.76rem;margin-right:4px}
.fresh.stale{border-color:#a16207;background:#2a2410}.fresh.old{border-color:#b91c1c;background:#2a1414}
.fresh .warn{font-weight:600;color:#fbbf24;flex-basis:100%}.fresh.old .warn{color:#f87171}
@media (max-width:640px){
  .wrap{padding:12px}.card{padding:12px}table{font-size:.74rem}
  th{padding:6px 6px}td{padding:5px 6px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:10px 12px;white-space:nowrap}
  .scroll{max-height:70vh}
  /* 台股篩選表：左右滑動時固定「判定／代號／名稱」三欄 */
  #screenTable th:nth-child(-n+3),#screenTable td:nth-child(-n+3){position:sticky;z-index:1;background:#161b26}
  #screenTable th:nth-child(-n+3){z-index:3;background:#1e2a3d}
  #screenTable tr.row:hover td:nth-child(-n+3){background:#1a2233}
  #screenTable th:nth-child(1),#screenTable td:nth-child(1){left:0;min-width:34px;max-width:34px;padding-left:4px;padding-right:2px;overflow:hidden}
  #screenTable th:nth-child(2),#screenTable td:nth-child(2){left:34px;min-width:50px;max-width:50px}
  #screenTable th:nth-child(3),#screenTable td:nth-child(3){left:84px;min-width:72px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #334155}
}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h1>投資篩選儀表板</h1>
  <div class="sub">內容已加密，請輸入密碼</div>
  <form id="lockForm" autocomplete="on">
    <input type="text" name="username" value="invest-screener" autocomplete="username" hidden>
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autofocus>
    <label class="chk" style="margin-top:10px"><input id="remember" type="checkbox"> 在這台裝置保持解鎖（不儲存密碼本身）</label>
    <button type="submit" id="unlockBtn" style="width:100%">解鎖</button>
    <div class="err" id="err"></div>
  </form>
</div></div>

<div id="app"><div class="wrap">
  <h1>投資篩選儀表板</h1>
  <div class="sub" id="subtitle"></div>
  <div class="fresh" id="fresh"></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="p-overview"></div>
  <div class="panel" id="p-screen"></div>
  <div class="panel" id="p-pick"></div>
  <div class="panel" id="p-hold"></div>
  <div class="panel" id="p-us"></div>
  <div class="panel" id="p-rules"></div>
  <div class="foot">投資篩選儀表板｜數據來源：TWSE、FinMind、FRED、yfinance、RSS｜非投資建議，實際進出請自行判斷並控管風險
    ｜<a href="#" id="logout" style="color:#64748b">登出（清除這台裝置的解鎖金鑰）</a></div>
</div></div>
<div class="tip" id="tip"></div>

// ── 解密 ─────────────────────────────────────────────
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 「保持解鎖」存的是 PBKDF2 導出的 AES 金鑰（不可匯出的 CryptoKey，放 IndexedDB），不是密碼。
// 金鑰和 salt／iter 綁定；網站換密碼（或換 salt）後舊金鑰解不開，會自動清除並要求重新輸入。
const KDB = "invest-screener-key";
const idb = (mode, fn) => new Promise((res, rej) => {
  const open = indexedDB.open(KDB, 1);
  open.onupgradeneeded = () => open.result.createObjectStore("k");
  open.onerror = () => rej(open.error);
  open.onsuccess = () => {
    const db = open.result, tx = db.transaction("k", mode), rq = fn(tx.objectStore("k"));
    tx.oncomplete = () => { db.close(); res(rq.result); };
    tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
  };
});
const keyTag = () => PAYLOAD.salt + ":" + PAYLOAD.iter;
const saveKey = key => idb("readwrite", st => st.put({key, tag: keyTag()}, "site"));
const loadKey = async () => { try { const v = await idb("readonly", st => st.get("site")); return v && v.tag === keyTag() ? v.key : null; } catch (e) { return null; } };
const clearKey = async () => { localStorage.removeItem(KEY); try { await idb("readwrite", st => st.delete("site")); } catch (e) { /* 沒有 IndexedDB 就沒有東西可清 */ } };

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);  // extractable = false
}
async function decryptWith(key) {
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function show(data) { $("lock").style.display = "none"; $("app").style.display = "block"; render(data); }
async function unlock(pw, remember) {
  $("unlockBtn").disabled = true; $("err").textContent = "解密中…";
  try {
    const key = await deriveKey(pw), data = await decryptWith(key);
    localStorage.removeItem(KEY);  // 舊版存過的明文密碼一律清掉
    if (remember) { try { await saveKey(key); } catch (e) { /* 無法儲存（例如無痕模式）：這次照常解鎖 */ } }
    show(data);
  } catch (e) {
    await clearKey();
    $("err").textContent = "密碼錯誤"; $("unlockBtn").disabled = false;
  }
}
async function autoUnlock() {
  const key = await loadKey();
  if (key) {
    try { show(await decryptWith(key)); return; } catch (e) { await clearKey(); }
  }
  const old = localStorage.getItem(KEY);  // 舊版記住的明文密碼：用一次換成金鑰後刪除
  if (old) await unlock(old, true);
}
$("lockForm").addEventListener("submit", e => { e.preventDefault(); unlock($("pw").value, $("remember").checked); });
$("logout").addEventListener("click", async e => { e.preventDefault(); await clearKey(); location.reload(); });

if (PAYLOAD.v === 0) setTimeout(() => show(PAYLOAD.plain));
else setTimeout(autoUnlock);

// 序列選項：dash（虛線）、opacity（線條透明度）
function lineChart({title, series, unit="", rule=null, ruleLabel="", digits=2, zero=false, legend=false, stack=false, yfmt=null, tipFn=null, W=560, H=220, bands=[]}) {
  const L = 52, R = 12, T = 10, B = 26;
  if (stack) {
    const acc = {};
    series = series.map(s => ({...s, points: s.points.map(p => [p[0], acc[p[0]] = (acc[p[0]] || 0) + (num(p[1]) ?? 0)])}));
  }
  const all = series.flatMap(s => s.points.filter(p => num(p[1]) !== null));
  if (!all.length) return `<div class="chart"><div class="t">${esc(title)}</div><div class="mut" style="padding:20px">無資料</div></div>`;
  const xs = all.map(p => +new Date(p[0])), ys = all.map(p => +p[1]);
  if (rule !== null) ys.push(rule); if (zero || stack) ys.push(0);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x0 === x1) { x0 -= 864e5; x1 += 864e5; }
  const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
  if (stack && Math.min(...ys) >= 0) y0 = 0;  // 堆疊面積從 0 起算
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = sy(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#273244"/><text x="${L-6}" y="${y+3}" text-anchor="end">${yfmt ? yfmt(v) : fmt(v, Math.abs(y1-y0) > 50 ? 0 : 1)}</text>`;
  }
  const short = x1 - x0 < 120 * 864e5;  // 區間短於約 4 個月時，X 軸改標月-日
  for (let i = 0; i <= 4; i++) {
    const x = x0 + (x1 - x0) * i / 4, d = new Date(x), mm = String(d.getMonth()+1).padStart(2,"0");
    g += `<text x="${sx(x)}" y="${H-8}" text-anchor="${i === 4 ? "end" : "middle"}">${short ? mm + "-" + String(d.getDate()).padStart(2,"0") : d.getFullYear() + "-" + mm}</text>`;
  }
  let bandText = "";  // 標籤最後畫，才不會被面積蓋住
  bands.forEach(b => {
    const a = sx(Math.max(x0, +new Date(b.from))), z = sx(Math.min(x1, +new Date(b.to)));
    if (z < a) return;
    g += `<rect x="${a}" y="${T}" width="${Math.max(z - a, 1)}" height="${H-T-B}" fill="#94a3b8" fill-opacity=".1"/>`;
    // 堆疊面積會蓋住底色，改在上面加一層暗色讓這段變淡
    if (stack) bandText += `<rect x="${a}" y="${T}" width="${Math.max(z - a, 1)}" height="${H-T-B}" fill="#0d1016" fill-opacity=".45"/>`;
    if (b.label && z - a > 26) bandText += `<text x="${a+4}" y="${T+12}">${esc(b.label)}</text>`;
  });
  if (zero) g += `<line x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}" stroke="#94a3b8"/>`;
  if (rule !== null) g += `<line x1="${L}" x2="${W-R}" y1="${sy(rule)}" y2="${sy(rule)}" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="${L+4}" y="${sy(rule)-5}">${esc(ruleLabel)}</text>`;
  const dots = [];
  let below = null;  // 堆疊時下一層的頂線
  series.forEach((s, i) => {
    const pts = s.points.filter(p => num(p[1]) !== null);
    const color = s.color || SERIES[i % SERIES.length];
    const xy = pts.map(p => sx(+new Date(p[0])) + "," + sy(+p[1]));
    if (stack && xy.length) {
      const base = below || [`${sx(+new Date(pts[pts.length-1][0]))},${sy(0)}`, `${sx(+new Date(pts[0][0]))},${sy(0)}`];
      g += `<polygon fill="${color}" fill-opacity=".35" stroke="none" points="${xy.join(" ")} ${base.join(" ")}"/>`;
      below = [...xy].reverse();
    }
    const segs = [[]];  // 遇到 null 斷開
    s.points.forEach(p => num(p[1]) === null ? segs.push([]) : segs[segs.length-1].push(sx(+new Date(p[0])) + "," + sy(+p[1])));
    segs.filter(sg => sg.length).forEach(sg => g += `<polyline fill="none" stroke="${color}" stroke-width="2"${s.dash ? ' stroke-dasharray="5 4"' : ""}${s.opacity ? ` stroke-opacity="${s.opacity}"` : ""} points="${sg.join(" ")}"/>`);
    if (s.points.length < 40) pts.forEach(p => g += `<circle cx="${sx(+new Date(p[0]))}" cy="${sy(+p[1])}" r="3" fill="${color}"/>`);
    pts.forEach(p => dots.push({x: sx(+new Date(p[0])), y: sy(+p[1]), name: s.name, d: String(p[0]).slice(0,10), v: +p[1], color}));
  });
  g += bandText;
  const id = "c" + Math.random().toString(36).slice(2);
  CHARTS[id] = {dots, unit, digits, W, tipFn};
  const swatch = (s, i) => { const c = s.color || SERIES[i % SERIES.length]; return s.dash ? `repeating-linear-gradient(90deg,${c} 0 3px,transparent 3px 5px)` : c; };
  const bandLeg = [...new Set(bands.map(b => b.label).filter(Boolean))].map(l => `<span><i style="background:#94a3b8;opacity:.3;height:10px"></i>${esc(l)}</span>`).join("");
  const leg = legend ? `<div class="legend">${series.map((s,i) => `<span><i style="background:${swatch(s, i)}${s.opacity ? ";opacity:" + s.opacity : ""}"></i>${esc(s.name)}</span>`).join("")}${bandLeg}</div>` : "";
  return `<div class="chart"><div class="t">${esc(title)}</div>${leg}<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${g}<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#94a3b8" opacity="0"/></svg></div>`;
}
const CHARTS = {};
function bindCharts() {
  Object.entries(CHARTS).forEach(([id, c]) => {
    const svg = $(id); if (!svg || svg.dataset.bound) return; svg.dataset.bound = 1;
    const cross = svg.querySelector(".cross");
    const show = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * c.W;
      let best = null;
      c.dots.forEach(p => { if (!best || Math.abs(p.x - x) < Math.abs(best.x - x)) best = p; });
      if (!best) return;
      const near = c.dots.filter(p => Math.abs(p.x - best.x) < 0.5);
      cross.setAttribute("x1", best.x); cross.setAttribute("x2", best.x); cross.setAttribute("opacity", .6);
      tip.innerHTML = c.tipFn ? c.tipFn(best.d) : `<b>${best.d}</b><br>` + near.map(p => `<span style="color:${p.color}">●</span> ${esc(p.name)} ${fmt(p.v, c.digits)} ${esc(c.unit)}`).join("<br>");
      tip.style.display = "block";
      // 不超出視窗（手機窄螢幕時改放到手指左側）
      const w = tip.offsetWidth, h = tip.offsetHeight;
      const left = e.clientX + 12 + w > innerWidth - 4 ? Math.max(4, e.clientX - 12 - w) : e.clientX + 12;
      const top = e.clientY + 12 + h > innerHeight - 4 ? Math.max(4, e.clientY - 12 - h) : e.clientY + 12;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    };
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);  // 手機點擊
    svg.addEventListener("pointerleave", e => {
      if (e.pointerType === "touch") return;  // 觸控放開後保留提示，點其他地方再關
      tip.style.display = "none"; cross.setAttribute("opacity", 0);
    });
  });
}
document.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest("svg[id^='c']")) return;
  tip.style.display = "none";
  document.querySelectorAll("svg .cross").forEach(x => x.setAttribute("opacity", 0));
});

// 資料新鮮度：排程是台北週一～五 18:07、週二～六 09:07（以下用整點加 8 小時寬限判斷）。最近一個「應該已跑完」的排程
// （給 8 小時延遲寬限）之後還沒有新的產生時間，就提醒資料可能過期。
const TPE = 8 * 3600e3, GRACE_H = 8;
function lastDue(nowMs) {
  const t = new Date(nowMs - GRACE_H * 3600e3 + TPE);  // 以 UTC 欄位讀出台北時間
  for (let i = 0; i < 8; i++) {
    const d = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate() - i)), wd = d.getUTCDay();
    const slots = [];
    if (wd >= 1 && wd <= 5) slots.push(18);
    if (wd >= 2 && wd <= 6) slots.push(9);
    for (const h of slots) {
      const due = d.getTime() + h * 3600e3;
      if (due <= t.getTime()) return due - TPE;
    }
  }
  return null;
}
// 兩個 YYYY-MM-DD 之間相隔幾個平日（不含起日、含迄日）
// 產生時間對應的篩選日（台北時間 14:00 前執行算前一天，同 daily.screen_date）
function nominalDate(genMs) {
  const t = new Date(genMs + 8 * 3600e3);  // 位移後用 UTC 欄位讀，就是台北時間
  if (t.getUTCHours() < 14) t.setUTCDate(t.getUTCDate() - 1);
  return t.toISOString().slice(0, 10);
}
function weekdaysBetween(from, to) {
  const a = Date.parse(from + "T00:00:00Z"), b = Date.parse(to + "T00:00:00Z");
  if (Number.isNaN(a) || Number.isNaN(b) || b <= a) return 0;
  let n = 0;
  for (let t = a + 864e5; t <= b; t += 864e5) { const wd = new Date(t).getUTCDay(); if (wd >= 1 && wd <= 5) n++; }
  return n;
}
function freshness(D, nowMs = Date.now()) {
  const gen = D.generated_at ? Date.parse(D.generated_at + ":00+08:00") : NaN;
  if (Number.isNaN(gen)) return {cls: "stale", warn: "⚠ 沒有產生時間，無法判斷資料是否最新"};
  const due = lastDue(nowMs), age = (nowMs - gen) / 3600e3;
  if (due === null || gen >= due) {
    // 網站有更新，但台股最新收盤日落後超過 1 個平日：可能是資料沒抓到（遇到休市屬正常）
    // 休市日不另外篩選（資料日停在最後一個交易日），所以和「這次執行本來該處理的日期」比，不和資料日比
    const px = (D.market || {}).date, lag = px ? weekdaysBetween(px, nominalDate(gen)) : 0;
    if (lag > 1) return {cls: "stale", warn: `⚠ 台股最新收盤日是 ${px}，已落後 ${lag} 個平日；若不是連續休市，可能是股價資料沒抓到`};
    return {cls: "", warn: ""};
  }
  const txt = age >= 48 ? `約 ${Math.floor(age / 24)} 天` : `約 ${Math.round(age)} 小時`;
  return {cls: age >= 72 ? "old" : "stale", warn: `⚠ 資料可能不是最新：${txt}前產生，之後應有的排程還沒更新（GitHub 排程可能延遲或失敗）`};
}

}

const yamlLine = url => "  - " + String(url).trim();  // 兩個空格、減號、空格、完整網址
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 改用退路 */ }
  }
  const ta = document.createElement("textarea");  // 退路：舊瀏覽器、非 https、權限被拒
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function bindNews() {
  const list = $("newsList"); if (!list) return;

    b.classList.remove("ok", "err"); b.classList.add(ok ? "ok" : "err");

}

const HIST = {range:365, mode:"total", rows:[], kt:{}};
const KIND_COLOR = {core:SERIES[0], stock:SERIES[1], leveraged:SERIES[4], dividend:SERIES[2]};

function drawHistory() {
  const box = $("histChart"); if (!box) return;
  const all = HIST.rows, last = +new Date(all[all.length - 1].date);
  const rows = all.filter(r => +new Date(r.date) >= last - HIST.range * 864e5);
  const byDate = Object.fromEntries(rows.map(r => [String(r.date).slice(0, 10), r]));
  const sign = v => num(v) === null ? "—" : (v >= 0 ? "+" : "") + Math.round(v).toLocaleString();
  const cls = v => num(v) === null ? "" : (v >= 0 ? "g" : "r");
  const int = v => num(v) === null ? "—" : Math.round(v).toLocaleString();
  const est = r => !!(r && r.estimated);
  const kinds = [...new Set(rows.flatMap(r => Object.keys(r.by_kind || {})))].sort((a, b) => (rows[rows.length-1].by_kind?.[b] ?? 0) - (rows[rows.length-1].by_kind?.[a] ?? 0));
  // 推算日：成本是用目前均價算的，不顯示成本與損益
  const tipFn = d => {
    const r = byDate[d]; if (!r) return esc(d);
    const extra = HIST.mode === "kind" ? kinds.map(k => `<br><span style="color:${KIND_COLOR[k] || "#64748b"}">●</span> ${esc(HIST.kt[k] || k)} ${int((r.by_kind || {})[k] ?? 0)}`).join("") : "";
    if (est(r)) return `<b>${esc(d)}</b> <span class="mut">推算</span><br>市值 ${int(r.value_twd)}<br><span class="mut">推算值（目前持股 × 歷史價）</span>${extra}`;
    return `<b>${esc(d)}</b><br>市值 ${int(r.value_twd)}<br>成本 ${int(r.cost_twd)}` +
      `<br>損益 <span class="${cls(r.pnl_twd)}">${sign(r.pnl_twd)}（${fmt(r.pnl_pct, 2, "%")}）</span>${extra}`;
  };
  // 推算區段：連續的 estimated 日，延伸到下一個真實日讓底色接上
  const bands = [];
  rows.forEach((r, i) => {
    if (!est(r)) return;
    const to = rows[i + 1] ? rows[i + 1].date : r.date;
    const prev = bands[bands.length - 1];
    if (prev && i > 0 && est(rows[i - 1])) prev.to = to; else bands.push({from: r.date, to, label: "推算"});
  });
  const hasEst = bands.length > 0;
  const series = HIST.mode === "kind"
    ? kinds.map(k => ({name: HIST.kt[k] || k, color: KIND_COLOR[k] || "#64748b", points: rows.map(r => [r.date, (r.by_kind || {})[k] ?? 0])}))
    : [
        {name:"總市值", color:SERIES[0], points: rows.map(r => [r.date, est(r) ? null : r.value_twd])},
        // 推算線多畫相鄰的真實日一點，兩段才會接起來
        ...(hasEst ? [{name:"總市值（推算）", color:SERIES[0], dash:true, opacity:.55,
          points: rows.map((r, i) => [r.date, est(r) || est(rows[i - 1]) || est(rows[i + 1]) ? r.value_twd : null])}] : []),
        {name:"總成本", color:"#94a3b8", dash:true, points: rows.map(r => [r.date, est(r) ? null : r.cost_twd])},
      ];
  const first = rows[0], end = rows[rows.length - 1], chg = end.value_twd - first.value_twd;
  const lastReal = [...all].reverse().find(r => !est(r));
  Object.keys(CHARTS).forEach(id => { if (!document.getElementById(id)) delete CHARTS[id]; });
  const narrow = innerWidth < 640;  // 手機：較窄的 viewBox，字才不會縮太小
  box.innerHTML = `<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <div class="kpi"><span class="l">區間市值變化${est(first) ? '<span class="y">（含推算）</span>' : ""}</span><b class="${cls(chg)}">${sign(chg)}</b><span class="d">${esc(String(first.date).slice(2,10))} → ${esc(String(end.date).slice(2,10))}</span></div>
      <div class="kpi"><span class="l">期末未實現損益</span>${lastReal
        ? `<b class="${cls(lastReal.pnl_twd)}">${sign(lastReal.pnl_twd)}</b><span class="d"><span class="${cls(lastReal.pnl_pct)}">${fmt(lastReal.pnl_pct, 2, "%")}</span>｜${esc(String(lastReal.date).slice(2,10))}</span>`
        : `<b class="mut">—</b><span class="d">尚無真實快照</span>`}</div>
    </div>` + lineChart({title: HIST.mode === "kind" ? "市值（依類別堆疊，台幣）" : "總市值與總成本（台幣）", series, legend:true, stack: HIST.mode === "kind", yfmt: wan, tipFn, bands, W: narrow ? 360 : 560, H: narrow ? 250 : 220});
  bindCharts();
}

  }
  const head = `<thead><tr>${COLS.map(c => `<th class="sort" data-k="${c[0]}">${c[1]}${SORT.key === c[0] ? (SORT.asc ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>`;
  const body = view.map(r => `<tr class="row" data-id="${esc(r.stock_id)}">${COLS.map(c => {
    if (typeof c[2] === "function") return `<td>${esc(c[2](r))}</td>`;
    if (typeof c[2] === "number") return `<td class="n">${fmt(r[c[0]], c[2])}</td>`;
    return `<td style="white-space:nowrap">${esc(r[c[0]])}</td>`;
  }).join("")}</tr>`).join("");
  const t = $("screenTable"); t.innerHTML = head + `<tbody>${body}</tbody>`;
  t.querySelectorAll("th.sort").forEach(th => th.addEventListener("click", () => {
    SORT = SORT.key === th.dataset.k ? {key: th.dataset.k, asc: !SORT.asc} : {key: th.dataset.k, asc: true};
    drawScreen(rows);
  }));
  t.querySelectorAll("tr.row").forEach(tr => tr.addEventListener("click", () => {
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("detail")) { next.remove(); return; }
    const r = rows.find(x => x.stock_id === tr.dataset.id);
    const groups = [["pass","✓ 符合","g"],["warn","△ 留意","y"],["fail","✗ 未過／排雷","r"],["flag","⚠ 旗標","y"],["na","— 不適用／資料不足","mut"]];
    const html = `<b>${esc(LABELS[r.verdict])}</b><div class="cols" style="margin-top:8px">` + groups.map(([lvl, label, cls]) => {
      const items = (r.checks || []).filter(c => c.level === lvl);
      return items.length ? `<div><span class="${cls}">${label}</span>${items.map(c => `<div>• ${esc(c.message)}</div>`).join("")}</div>` : "";
    }).join("") + `</div><div class="mut" style="font-size:.72rem;margin-top:6px">財報季 ${esc(r.fin_quarter)}｜現金流季 ${esc(r.cf_quarter)}｜營收月 ${esc(r.revenue_month)}｜產業 ${esc(r.industry)}</div>`;
    tr.insertAdjacentHTML("afterend", `<tr class="detail"><td colspan="${COLS.length}">${html}</td></tr>`);
  }));
}

// ── 💰 可投資標的：依自己的規則機械分組＋資金試算（非投資建議） ──
function renderPick(D) {
  const C = D.candidates || {groups:{}, labels:{}, etfs:[], calculator:{core_ratio:70, lot_size:1000}, near:{}};
  const byId = Object.fromEntries((D.screen || []).map(r => [r.stock_id, r]));
  const lot = C.calculator.lot_size || 1000;
  const desc = {
    qualified: "通過 GARP／PEG／體質檢查（🟢）。",
    near: `🟡 但沒有任何排雷項、非強制降級、PEG ≤ ${C.near.peg_max}、留意項 ≤ ${C.near.max_warn}。`,
    satellite: "缺貨漲價類或護城河只是站在供需缺口，雖無排雷項，規則要求只當波段／衛星、嚴設停損。",
    financial: "沒有排雷項的金融股。本業占比、負債比、現金流對金融業不適用，檢查項較少；EPS 波動大，PEG 僅供參考。",
  };
  const groupTable = k => {
    const ids = (C.groups[k] || []).filter(id => byId[id]);
    if (!ids.length) return `<p class="mut" style="font-size:.82rem">目前沒有符合的標的</p>`;
    return `<div class="scroll" style="max-height:none"><table><thead><tr><th>試算</th><th>代號</th><th>名稱</th><th>收盤</th><th>一張成本</th><th>PE</th><th>PEG</th><th>ROE%</th><th>營收YoY%</th><th>FCF(億)</th><th>護城河</th><th>留意／旗標</th></tr></thead><tbody>` +
      ids.map(id => { const r = byId[id];
        const notes = (r.checks || []).filter(c => c.level === "warn" || c.level === "flag").map(c => c.message);
        return `<tr><td><input type="checkbox" class="pk" data-id="${esc(id)}" ${k === "satellite" || k === "financial" ? "" : "checked"} style="width:auto"></td>
          <td>${esc(id)}</td><td style="white-space:nowrap">${esc(r.name)}</td><td class="n">${fmt(r.close,2)}</td>
          <td class="n">${num(r.close) === null ? "—" : Math.round(r.close * lot).toLocaleString()}</td>
          <td class="n">${fmt(r.pe)}</td><td class="n">${fmt(r.peg,2)}</td><td class="n">${fmt(r.roe_4q)}</td><td class="n">${fmt(r.revenue_yoy)}</td>
          <td class="n">${r.is_financial ? '<span class="mut">不適用</span>' : fmt(yi(r.fcf_ttm),0)}</td><td>${MOAT[r.moat] || "—"}</td>
          <td style="font-size:.74rem;min-width:220px">${notes.map(esc).join("<br>") || '<span class="mut">—</span>'}</td></tr>`; }).join("") +
      `</tbody></table></div>`;
  };
  const etfRows = (C.etfs || []).map(e => `<tr><td>${esc(e.code)}</td><td>${esc(e.name)}</td><td>${esc(e.role)}</td>
    <td class="n">${fmt(e.close,2)}</td><td>${esc(e.watch)}</td></tr>`).join("");
  $("p-pick").innerHTML = `
  <div class="card"><h2>💰 可投資標的</h2>
    <p style="font-size:.84rem">依你設定的篩選規則（§4-1）把今天的結果<b>機械式分組</b>，並提供資金試算。系統不判斷該不該買、買多少；
    名單只是「通過你自己規則的範圍」，進場前仍須做基本面／技術面／籌碼面分析並查證最新數據。</p>
    <p class="mut" style="font-size:.76rem;margin-top:4px">※ 非投資建議。篩選日期：${esc(D.screen_date)}；股價為最近收盤價。</p>
  </div>
  <div class="card"><h2>🧱 核心（ETF 定期定額）</h2>
    ${etfRows ? `<table><thead><tr><th>代號</th><th>名稱</th><th>定位</th><th>收盤</th><th>紀律</th></tr></thead><tbody>${etfRows}</tbody></table>` : '<p class="mut">watchlist 沒有 ETF</p>'}
    <p class="mut" style="font-size:.74rem;margin-top:6px">核心不跑個股篩選；依紀律「高檔照扣、不猜點位」。清單在 config/watchlist.yaml（etf: true）。</p>
  </div>
  ${["qualified","near","satellite","financial"].map(k => `<div class="card"><h2>${esc(C.labels[k] || k)} <span class="mut" style="font-size:.78rem;font-weight:400">${(C.groups[k]||[]).length} 檔</span></h2>
    <p class="mut" style="font-size:.78rem;margin-bottom:8px">${desc[k]}</p>${groupTable(k)}</div>`).join("")}
  <div class="card"><h2>🧮 資金試算</h2>
    <div class="grid">
      <div><label>可投入資金（元）</label><input id="cap" type="number" min="0" step="10000" value="1000000"></div>
      <div><label>核心（ETF）占比 %</label><input id="coreR" type="number" min="0" max="100" step="5" value="${C.calculator.core_ratio}"></div>
      <div><label>衛星配置</label><select id="mode"><option value="equal">勾選標的平均分配</option></select></div>
      <div><label>零股</label><select id="odd"><option value="yes">整張買不起時改買零股</option><option value="no">只買整張</option></select></div>
    </div>
    <p class="mut" style="font-size:.76rem;margin-top:6px">衛星資金平均分給上方表格「試算」欄有勾選的標的；核心資金平均分給 ETF。未計手續費與稅。</p>
    <div id="calc" style="margin-top:10px"></div>
  </div>`;
  const calc = () => {
    const cap = Math.max(0, parseFloat($("cap").value) || 0);
    const coreR = Math.min(100, Math.max(0, parseFloat($("coreR").value) || 0)) / 100;
    const odd = $("odd").value === "yes";
    const picked = [...document.querySelectorAll(".pk:checked")].map(x => byId[x.dataset.id]).filter(Boolean);
    const coreAmt = cap * coreR, satAmt = cap - coreAmt;
    const buy = (budget, price) => {
      if (num(price) === null || price <= 0) return {lots:0, odd:0, cost:0};
      const lots = Math.floor(budget / (price * lot));
      let rest = budget - lots * price * lot, oddN = 0;
      if (odd) { oddN = Math.floor(rest / price); }
      return {lots, odd:oddN, cost: lots * price * lot + oddN * price};
    };
    const rows = []; let used = 0;
    const etfs = (C.etfs || []);
    etfs.forEach(e => { const b = etfs.length ? coreAmt / etfs.length : 0, x = buy(b, e.close); used += x.cost;
      rows.push(`<tr><td>核心</td><td>${esc(e.code)} ${esc(e.name)}</td><td class="n">${Math.round(b).toLocaleString()}</td><td class="n">${fmt(e.close,2)}</td>
        <td class="n">${num(e.close) === null ? "定期定額" : x.lots}</td><td class="n">${num(e.close) === null ? "—" : x.odd.toLocaleString()}</td><td class="n">${num(e.close) === null ? "—" : Math.round(x.cost).toLocaleString()}</td></tr>`);
      if (num(e.close) === null) used += b; });
    picked.forEach(r => { const b = picked.length ? satAmt / picked.length : 0, x = buy(b, r.close); used += x.cost;
      rows.push(`<tr><td>衛星</td><td>${esc(r.stock_id)} ${esc(r.name)}${r.shortage ? " ⚠" : ""}</td><td class="n">${Math.round(b).toLocaleString()}</td><td class="n">${fmt(r.close,2)}</td>
        <td class="n">${x.lots}</td><td class="n">${x.odd.toLocaleString()}</td><td class="n">${Math.round(x.cost).toLocaleString()}</td></tr>`); });
    if (!picked.length && satAmt > 0) rows.push(`<tr><td>衛星</td><td colspan="6" class="mut">沒有勾選標的，衛星資金 ${Math.round(satAmt).toLocaleString()} 元保留現金</td></tr>`);
    $("calc").innerHTML = `<div class="scroll" style="max-height:none"><table><thead><tr><th>類別</th><th>標的</th><th>分配預算</th><th>收盤</th><th>整張</th><th>零股(股)</th><th>試算金額</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
      <div class="kpis" style="margin-top:10px">
        <div class="kpi"><span class="l">核心</span><b>${Math.round(coreAmt).toLocaleString()}</b><span class="d">${Math.round(coreR*100)}%</span></div>
        <div class="kpi"><span class="l">衛星（${picked.length} 檔）</span><b>${Math.round(satAmt).toLocaleString()}</b><span class="d">每檔 ${picked.length ? Math.round(satAmt/picked.length).toLocaleString() : 0}</span></div>
        <div class="kpi"><span class="l">試算投入</span><b>${Math.round(used).toLocaleString()}</b><span class="d">剩餘現金 ${Math.round(cap - used).toLocaleString()}</span></div>
      </div>
      <p class="mut" style="font-size:.72rem;margin-top:6px">※ 試算只是把資金依你設定的比例換算成股數，不代表建議買進；紀律提醒：等回檔、分批、不追高，⚠ 降級股嚴設停損。</p>`;
  };
  ["cap","coreR","odd"].forEach(id => $(id).addEventListener("input", calc));
  document.querySelectorAll(".pk").forEach(x => x.addEventListener("change", calc));
  calc();
}

// ── 手動篩選：與 Python rules/tw_garp.py 同一套規則 ─────
function manualForm() {
  const n = (id, label, v, step=1) => `<div><label>${label}</label><input id="${id}" type="number" step="${step}" value="${v}"></div>`;
  const s = (id, label, opts) => `<div><label>${label}</label><select id="${id}">${opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select></div>`;
  return `<div class="grid">
    ${n("mPe","本益比 PE",18,0.1)}${n("mG","EPS 年成長率 g (%)",25)}${n("mRoe","近四季 ROE (%)",22,0.1)}${n("mCore","本業占稅前 (%)",85)}
    ${n("mYoy","月營收 YoY (%)",11,0.1)}${s("mWeak","月營收連兩月轉弱？",[["no","否"],["yes","是"]])}${n("mDebt","負債比 (%)",55)}${n("mVol","日均量 (張)",2000,100)}
    ${s("mOcf","營業現金流 ≥ 淨利？",[["yes","是"],["no","否"]])}${s("mFcf","自由現金流 FCF",[["pos","為正"],["neg","為負"]])}
    ${s("mNd","淨負債水位",[["low","低/淨現金"],["high","偏高"]])}${s("mMoat","護城河等級",[["strong","有（不可取代技術）"],["normal","普通"],["gap","只是站在供需缺口"]])}
    ${s("mShort","缺貨漲價類？",[["no","否"],["yes","是"]])}${s("mFor","外資近 20 日",[["buy","買超"],["flat","持平"],["sell","賣超"]])}
    ${s("mFin","金融股？",[["no","否"],["yes","是（本業占比、負債比、現金流不適用）"]])}
  </div><button id="mBtn">篩選判定</button>`;
}
function runManual(C) {
  const g = id => $(id).value, f = id => parseFloat($(id).value);
  const pe = f("mPe"), gr = f("mG"), roe = f("mRoe"), core = f("mCore"), yoy = f("mYoy"), debt = f("mDebt"), vol = f("mVol");
  const fin = g("mFin") === "yes", shortage = g("mShort") === "yes", moat = g("mMoat"), down = shortage || moat === "gap";
  const pass = [], warn = [], fail = [];
  const P = (cond, ok, w, bad) => cond === "pass" ? pass.push(ok) : cond === "warn" ? warn.push(w) : fail.push(bad);
  if (!isNaN(pe)) P(pe <= C.pe.pass_max ? "pass" : pe <= C.pe.warn_max ? "warn" : "fail", `PE ${pe} ≤ ${C.pe.pass_max}（符合 GARP 便宜）`, `PE ${pe}（略高，需高成長支撐）`, `PE ${pe} > ${C.pe.warn_max}（偏貴，容錯小）`);
  if (!isNaN(pe) && gr > 0) { const peg = Math.round(pe / gr * 100) / 100; P(peg < C.peg.pass_max_exclusive ? "pass" : peg <= C.peg.warn_max ? "warn" : "fail", `PEG ${peg} < ${C.peg.pass_max_exclusive}（成長付得起估值）`, `PEG ${peg}（中性）`, `PEG ${peg} > ${C.peg.warn_max}（成長撐不起估值）`); }
  if (!isNaN(roe)) P(roe >= C.roe_4q.pass_min ? "pass" : roe >= C.roe_4q.warn_min ? "warn" : "fail", `ROE ${roe}% ≥ ${C.roe_4q.pass_min}（高獲利品質）`, `ROE ${roe}%（中等）`, `ROE ${roe}% 偏低`);
  if (!fin && !isNaN(core)) P(core >= C.core_ratio.pass_min ? "pass" : "fail", `本業占稅前 ${core}%（本業紮實）`, "", `本業占稅前 ${core}% < ${C.core_ratio.pass_min}（業外撐，排雷）`);
  if (g("mWeak") === "yes") fail.push("月營收連兩月 YoY 轉負（動能持續走弱，排雷）");
  else if (!isNaN(yoy)) P(yoy > C.revenue_yoy.pass_min_exclusive ? "pass" : "warn", `月營收 YoY +${yoy}%（動能正）`, `月營收 YoY ${yoy}%（單月轉弱，留意）`, "");
  if (!fin && !isNaN(debt)) P(debt <= C.debt_ratio.pass_max ? "pass" : debt <= C.debt_ratio.warn_max ? "warn" : "fail", `負債比 ${debt}%（可接受）`, `負債比 ${debt}%（偏高，留意利息）`, `負債比 ${debt}% 過高`);
  if (!fin) {
    g("mOcf") === "yes" ? pass.push("營業現金流 ≥ 淨利（獲利有現金含量）") : warn.push("營業現金流 < 淨利（現金含量偏弱）");
    if (g("mFcf") === "pos") pass.push("自由現金流為正");
    else if (g("mNd") === "high") fail.push("⚠ 自由現金流為負＋淨負債高（脆弱體質，淘汰賽高風險）");
    else warn.push("自由現金流為負（燒錢中，盯回收）");
  }
  if (!isNaN(vol)) P(vol >= C.avg_volume.pass_min ? "pass" : "warn", `日均量 ${vol} 張（流動性足）`, `日均量 ${vol} 張（偏低，進出用限價）`, "");
  const lvMap = {buy: C.foreign_buy_level || "pass", flat: C.foreign_flat_level || "none", sell: C.foreign_sell_level || "warn"};
  const ftxt = {buy:"外資買超（籌碼面加分）", flat:"外資持平", sell:"外資賣超（籌碼面扣分）"}[g("mFor")];
  const fl = lvMap[g("mFor")]; if (fl === "pass") pass.push(ftxt); else if (fl === "warn") warn.push(ftxt); else if (fl === "fail") fail.push(ftxt);
  if (moat === "strong") pass.push("有護城河（不可取代技術）"); else if (moat === "normal") warn.push("護城河普通");
  const V = C.verdict;
  const level = (fail.length >= V.red_fail_min || (down && fail.length >= V.red_if_shortage_and_fail)) ? "red"
    : (down || fail.length >= V.yellow_fail_min || warn.length >= V.yellow_warn_min) ? "yellow" : "green";
  const flags = down ? ["⚠ " + (shortage ? "缺貨漲價類" : "護城河只是站在供需缺口") + "：低 PE 可能是循環頂陷阱，僅波段/衛星、嚴設停損，勿當長期核心"] : [];
  const block = (arr, label, cls) => arr.length ? `<div style="margin-top:8px"><span class="${cls}">${label}</span><br>${arr.map(x => "• " + esc(x)).join("<br>")}</div>` : "";
  $("verdict").innerHTML = `<div class="verdict v-${level}"><b style="font-size:1rem">${LABELS[level]}</b>${block(pass,"✓ 符合：","g")}${block(warn,"△ 留意：","y")}${block(fail,"✗ 未過/排雷：","r")}${block(flags,"⚠ 旗標：","y")}<div class="mut" style="margin-top:10px;font-size:.72rem">※ 初步機械式判定，非投資建議。合格者仍須做基本面/技術面/籌碼面完整分析＋查證最新數據。</div></div>`;
}
</script>
