<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>投資篩選儀表板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC',sans-serif;background:#0d1016;color:#e2e8f0;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#64748b;font-size:.78rem;margin:4px 0 14px}
.card{background:#161b26;border:1px solid #273244;border-radius:12px;padding:16px 18px;margin-bottom:16px}
h2{font-size:1.05rem;color:#93c5fd;margin-bottom:12px;padding-left:10px;border-left:3px solid #3b82f6;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:.92rem;color:#cbd5e1;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:#1e2a3d;color:#93c5fd;padding:7px 8px;text-align:left;border-bottom:2px solid #3b82f6;white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:#e2e8f0}
td{padding:6px 8px;border-bottom:1px solid #1e2636;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#1a2233}
.scroll{overflow:auto;max-height:560px;border:1px solid #1e2636;border-radius:8px}
.g{color:#4ade80;font-weight:600}.r{color:#f87171;font-weight:600}.y{color:#fbbf24;font-weight:600}.mut{color:#64748b}
ul{padding-left:18px;font-size:.84rem;color:#cbd5e1}li{margin:3px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#0d1016;border:1px solid #273244;border-radius:8px;padding:8px 12px}
.kpi .l{font-size:.74rem;color:#94a3b8}.kpi b{font-size:1.15rem;display:block}.kpi .d{font-size:.74rem;color:#94a3b8}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid #273244}
.tab{background:none;border:none;color:#94a3b8;padding:8px 14px;font-size:.88rem;cursor:pointer;border-bottom:2px solid transparent;margin:0}
.tab.on{color:#e2e8f0;border-bottom-color:#3b82f6}
.panel{display:none}.panel.on{display:block}
input,select{background:#0d1016;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:6px 8px;font-size:.84rem;width:100%}
label{font-size:.74rem;color:#94a3b8;display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
button{background:#2563eb;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:.85rem;cursor:pointer;margin-top:12px}
button:hover{background:#1d4ed8}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.filters>div{min-width:150px}.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;color:#cbd5e1;cursor:pointer}
.chk input{width:auto}
.detail td{background:#10151f}
.detail .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;font-size:.8rem}
.verdict{margin-top:14px;padding:12px;border-radius:8px;font-size:.88rem}
.v-green{background:#0f2a18;border:1px solid #166534}.v-yellow{background:#2a2410;border:1px solid #78350f}.v-red{background:#2a1215;border:1px solid #7f1d1d}
.chart{background:#0d1016;border:1px solid #273244;border-radius:8px;padding:8px}
.chart .t{font-size:.82rem;color:#e2e8f0;margin:0 0 4px 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:#cbd5e1;margin:0 0 4px 4px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;border-radius:2px}
svg text{fill:#94a3b8;font-size:10px}
.news{border-bottom:1px solid #1e2636;padding:8px 0;font-size:.84rem}
.news a{color:#93c5fd;text-decoration:none}.news a:hover{text-decoration:underline}
.foot{text-align:center;color:#475569;font-size:.7rem;margin-top:20px;padding-top:12px;border-top:1px solid #1e2636}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{background:#161b26;border:1px solid #273244;border-radius:14px;padding:28px;width:100%;max-width:360px}
#lock .err{color:#f87171;font-size:.82rem;min-height:1.2em;margin-top:8px}
#app{display:none}
.tip{position:fixed;pointer-events:none;background:#1e2a3d;border:1px solid #334155;border-radius:6px;padding:4px 8px;font-size:.75rem;color:#e2e8f0;display:none;z-index:9;white-space:nowrap}
@media (max-width:640px){.wrap{padding:12px}.card{padding:12px}table{font-size:.74rem}}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h1>投資篩選儀表板</h1>
  <div class="sub">內容已加密，請輸入密碼</div>
  <form id="lockForm" autocomplete="on">
    <input type="text" name="username" value="invest-screener" autocomplete="username" hidden>
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autofocus>
    <label class="chk" style="margin-top:10px"><input id="remember" type="checkbox"> 在這台裝置記住密碼</label>
    <button type="submit" id="unlockBtn" style="width:100%">解鎖</button>
    <div class="err" id="err"></div>
  </form>
</div></div>

<div id="app"><div class="wrap">
  <h1>投資篩選儀表板</h1>
  <div class="sub" id="subtitle"></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="p-overview"></div>
  <div class="panel" id="p-screen"></div>
  <div class="panel" id="p-pick"></div>
  <div class="panel" id="p-hold"></div>
  <div class="panel" id="p-us"></div>
  <div class="panel" id="p-rules"></div>
  <div class="foot">投資篩選儀表板｜數據來源：TWSE、FinMind、FRED、yfinance、RSS｜非投資建議，實際進出請自行判斷並控管風險
    ｜<a href="#" id="logout" style="color:#64748b">登出（清除記住的密碼）</a></div>
</div></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  if (PAYLOAD.v === 0) return PAYLOAD.plain;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(pw, remember) {

function lineChart({title, series, unit="", rule=null, ruleLabel="", digits=2, zero=false, legend=false}) {

  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = sy(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#273244"/><text x="${L-6}" y="${y+3}" text-anchor="end">${fmt(v, Math.abs(y1-y0) > 50 ? 0 : 1)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const x = x0 + (x1 - x0) * i / 4, d = new Date(x);
    g += `<text x="${sx(x)}" y="${H-8}" text-anchor="middle">${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}</text>`;
  }
  if (zero) g += `<line x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}" stroke="#94a3b8"/>`;
  if (rule !== null) g += `<line x1="${L}" x2="${W-R}" y1="${sy(rule)}" y2="${sy(rule)}" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="${L+4}" y="${sy(rule)-5}">${esc(ruleLabel)}</text>`;
  const dots = [];
  series.forEach((s, i) => {
    const pts = s.points.filter(p => num(p[1]) !== null);
    const color = s.color || SERIES[i % SERIES.length];
    g += `<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.map(p => sx(+new Date(p[0])) + "," + sy(+p[1])).join(" ")}"/>`;
    if (pts.length < 40) pts.forEach(p => g += `<circle cx="${sx(+new Date(p[0]))}" cy="${sy(+p[1])}" r="3" fill="${color}"/>`);
    pts.forEach(p => dots.push({x: sx(+new Date(p[0])), y: sy(+p[1]), name: s.name, d: String(p[0]).slice(0,10), v: +p[1], color}));
  });
  const id = "c" + Math.random().toString(36).slice(2);
  CHARTS[id] = {dots, unit, digits, W};
  const leg = legend ? `<div class="legend">${series.map((s,i) => `<span><i style="background:${s.color || SERIES[i % SERIES.length]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart"><div class="t">${esc(title)}</div>${leg}<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${g}<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#94a3b8" opacity="0"/></svg></div>`;
}
const CHARTS = {};
function bindCharts() {
  Object.entries(CHARTS).forEach(([id, c]) => {
    const svg = $(id); if (!svg || svg.dataset.bound) return; svg.dataset.bound = 1;
    const cross = svg.querySelector(".cross");
    svg.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * c.W;
      let best = null;
      c.dots.forEach(p => { if (!best || Math.abs(p.x - x) < Math.abs(best.x - x)) best = p; });
      if (!best) return;
      const near = c.dots.filter(p => Math.abs(p.x - best.x) < 0.5);
      cross.setAttribute("x1", best.x); cross.setAttribute("x2", best.x); cross.setAttribute("opacity", .6);
      tip.innerHTML = `<b>${best.d}</b><br>` + near.map(p => `<span style="color:${p.color}">●</span> ${esc(p.name)} ${fmt(p.v, c.digits)} ${esc(c.unit)}`).join("<br>");
      tip.style.display = "block"; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
    });
    svg.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("opacity", 0); });
  });
}

      const x = val(a), y = val(b);
      if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * (SORT.asc ? 1 : -1);
    });
  } else {
    view.sort((a, b) => ord[a.verdict] - ord[b.verdict] || (num(a.peg) ?? 99) - (num(b.peg) ?? 99) || (num(b.roe_4q) ?? -999) - (num(a.roe_4q) ?? -999));
  }
  const head = `<thead><tr>${COLS.map(c => `<th class="sort" data-k="${c[0]}">${c[1]}${SORT.key === c[0] ? (SORT.asc ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>`;
  const body = view.map(r => `<tr class="row" data-id="${esc(r.stock_id)}">${COLS.map(c => {
    if (typeof c[2] === "function") return `<td>${esc(c[2](r))}</td>`;
    if (typeof c[2] === "number") return `<td class="n">${fmt(r[c[0]], c[2])}</td>`;
    return `<td style="white-space:nowrap">${esc(r[c[0]])}</td>`;
  }).join("")}</tr>`).join("");
  const t = $("screenTable"); t.innerHTML = head + `<tbody>${body}</tbody>`;
  t.querySelectorAll("th.sort").forEach(th => th.addEventListener("click", () => {
    SORT = SORT.key === th.dataset.k ? {key: th.dataset.k, asc: !SORT.asc} : {key: th.dataset.k, asc: true};
    drawScreen(rows);
  }));
  t.querySelectorAll("tr.row").forEach(tr => tr.addEventListener("click", () => {
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("detail")) { next.remove(); return; }
    const r = rows.find(x => x.stock_id === tr.dataset.id);
    const groups = [["pass","✓ 符合","g"],["warn","△ 留意","y"],["fail","✗ 未過／排雷","r"],["flag","⚠ 旗標","y"],["na","— 不適用／資料不足","mut"]];
    const html = `<b>${esc(LABELS[r.verdict])}</b><div class="cols" style="margin-top:8px">` + groups.map(([lvl, label, cls]) => {
      const items = (r.checks || []).filter(c => c.level === lvl);
      return items.length ? `<div><span class="${cls}">${label}</span>${items.map(c => `<div>• ${esc(c.message)}</div>`).join("")}</div>` : "";
    }).join("") + `</div><div class="mut" style="font-size:.72rem;margin-top:6px">財報季 ${esc(r.fin_quarter)}｜現金流季 ${esc(r.cf_quarter)}｜營收月 ${esc(r.revenue_month)}｜產業 ${esc(r.industry)}</div>`;
    tr.insertAdjacentHTML("afterend", `<tr class="detail"><td colspan="${COLS.length}">${html}</td></tr>`);
  }));
}

// ── 💰 可投資標的：依自己的規則機械分組＋資金試算（非投資建議） ──
function renderPick(D) {
  const C = D.candidates || {groups:{}, labels:{}, etfs:[], calculator:{core_ratio:70, lot_size:1000}, near:{}};
  const byId = Object.fromEntries((D.screen || []).map(r => [r.stock_id, r]));
  const lot = C.calculator.lot_size || 1000;
  const desc = {
    qualified: "通過 GARP／PEG／體質檢查（🟢）。",
    near: `🟡 但沒有任何排雷項、非強制降級、PEG ≤ ${C.near.peg_max}、留意項 ≤ ${C.near.max_warn}。`,
    satellite: "缺貨漲價類或護城河只是站在供需缺口，雖無排雷項，規則要求只當波段／衛星、嚴設停損。",
    financial: "沒有排雷項的金融股。本業占比、負債比、現金流對金融業不適用，檢查項較少；EPS 波動大，PEG 僅供參考。",
  };
  const groupTable = k => {
    const ids = (C.groups[k] || []).filter(id => byId[id]);
    if (!ids.length) return `<p class="mut" style="font-size:.82rem">目前沒有符合的標的</p>`;
    return `<div class="scroll" style="max-height:none"><table><thead><tr><th>試算</th><th>代號</th><th>名稱</th><th>收盤</th><th>一張成本</th><th>PE</th><th>PEG</th><th>ROE%</th><th>營收YoY%</th><th>FCF(億)</th><th>護城河</th><th>留意／旗標</th></tr></thead><tbody>` +
      ids.map(id => { const r = byId[id];
        const notes = (r.checks || []).filter(c => c.level === "warn" || c.level === "flag").map(c => c.message);
        return `<tr><td><input type="checkbox" class="pk" data-id="${esc(id)}" ${k === "satellite" || k === "financial" ? "" : "checked"} style="width:auto"></td>
          <td>${esc(id)}</td><td style="white-space:nowrap">${esc(r.name)}</td><td class="n">${fmt(r.close,2)}</td>
          <td class="n">${num(r.close) === null ? "—" : Math.round(r.close * lot).toLocaleString()}</td>
          <td class="n">${fmt(r.pe)}</td><td class="n">${fmt(r.peg,2)}</td><td class="n">${fmt(r.roe_4q)}</td><td class="n">${fmt(r.revenue_yoy)}</td>
          <td class="n">${r.is_financial ? '<span class="mut">不適用</span>' : fmt(yi(r.fcf_ttm),0)}</td><td>${MOAT[r.moat] || "—"}</td>
          <td style="font-size:.74rem;min-width:220px">${notes.map(esc).join("<br>") || '<span class="mut">—</span>'}</td></tr>`; }).join("") +
      `</tbody></table></div>`;
  };
  const etfRows = (C.etfs || []).map(e => `<tr><td>${esc(e.code)}</td><td>${esc(e.name)}</td><td>${esc(e.role)}</td>
    <td class="n">${fmt(e.close,2)}</td><td>${esc(e.watch)}</td></tr>`).join("");
  $("p-pick").innerHTML = `
  <div class="card"><h2>💰 可投資標的</h2>
    <p style="font-size:.84rem">依你設定的篩選規則（§4-1）把今天的結果<b>機械式分組</b>，並提供資金試算。系統不判斷該不該買、買多少；
    名單只是「通過你自己規則的範圍」，進場前仍須做基本面／技術面／籌碼面分析並查證最新數據。</p>
    <p class="mut" style="font-size:.76rem;margin-top:4px">※ 非投資建議。篩選日期：${esc(D.screen_date)}；股價為最近收盤價。</p>
  </div>
  <div class="card"><h2>🧱 核心（ETF 定期定額）</h2>
    ${etfRows ? `<table><thead><tr><th>代號</th><th>名稱</th><th>定位</th><th>收盤</th><th>紀律</th></tr></thead><tbody>${etfRows}</tbody></table>` : '<p class="mut">watchlist 沒有 ETF</p>'}
    <p class="mut" style="font-size:.74rem;margin-top:6px">核心不跑個股篩選；依紀律「高檔照扣、不猜點位」。清單在 config/watchlist.yaml（etf: true）。</p>
  </div>
  ${["qualified","near","satellite","financial"].map(k => `<div class="card"><h2>${esc(C.labels[k] || k)} <span class="mut" style="font-size:.78rem;font-weight:400">${(C.groups[k]||[]).length} 檔</span></h2>
    <p class="mut" style="font-size:.78rem;margin-bottom:8px">${desc[k]}</p>${groupTable(k)}</div>`).join("")}
  <div class="card"><h2>🧮 資金試算</h2>
    <div class="grid">
      <div><label>可投入資金（元）</label><input id="cap" type="number" min="0" step="10000" value="1000000"></div>
      <div><label>核心（ETF）占比 %</label><input id="coreR" type="number" min="0" max="100" step="5" value="${C.calculator.core_ratio}"></div>
      <div><label>衛星配置</label><select id="mode"><option value="equal">勾選標的平均分配</option></select></div>
      <div><label>零股</label><select id="odd"><option value="yes">整張買不起時改買零股</option><option value="no">只買整張</option></select></div>
    </div>
    <p class="mut" style="font-size:.76rem;margin-top:6px">衛星資金平均分給上方表格「試算」欄有勾選的標的；核心資金平均分給 ETF。未計手續費與稅。</p>
    <div id="calc" style="margin-top:10px"></div>
  </div>`;
  const calc = () => {
    const cap = Math.max(0, parseFloat($("cap").value) || 0);
    const coreR = Math.min(100, Math.max(0, parseFloat($("coreR").value) || 0)) / 100;
    const odd = $("odd").value === "yes";
    const picked = [...document.querySelectorAll(".pk:checked")].map(x => byId[x.dataset.id]).filter(Boolean);
    const coreAmt = cap * coreR, satAmt = cap - coreAmt;
    const buy = (budget, price) => {
      if (num(price) === null || price <= 0) return {lots:0, odd:0, cost:0};
      const lots = Math.floor(budget / (price * lot));
      let rest = budget - lots * price * lot, oddN = 0;
      if (odd) { oddN = Math.floor(rest / price); }
      return {lots, odd:oddN, cost: lots * price * lot + oddN * price};
    };
    const rows = []; let used = 0;
    const etfs = (C.etfs || []);
    etfs.forEach(e => { const b = etfs.length ? coreAmt / etfs.length : 0, x = buy(b, e.close); used += x.cost;
      rows.push(`<tr><td>核心</td><td>${esc(e.code)} ${esc(e.name)}</td><td class="n">${Math.round(b).toLocaleString()}</td><td class="n">${fmt(e.close,2)}</td>
        <td class="n">${num(e.close) === null ? "定期定額" : x.lots}</td><td class="n">${num(e.close) === null ? "—" : x.odd.toLocaleString()}</td><td class="n">${num(e.close) === null ? "—" : Math.round(x.cost).toLocaleString()}</td></tr>`);
      if (num(e.close) === null) used += b; });
    picked.forEach(r => { const b = picked.length ? satAmt / picked.length : 0, x = buy(b, r.close); used += x.cost;
      rows.push(`<tr><td>衛星</td><td>${esc(r.stock_id)} ${esc(r.name)}${r.shortage ? " ⚠" : ""}</td><td class="n">${Math.round(b).toLocaleString()}</td><td class="n">${fmt(r.close,2)}</td>
        <td class="n">${x.lots}</td><td class="n">${x.odd.toLocaleString()}</td><td class="n">${Math.round(x.cost).toLocaleString()}</td></tr>`); });
    if (!picked.length && satAmt > 0) rows.push(`<tr><td>衛星</td><td colspan="6" class="mut">沒有勾選標的，衛星資金 ${Math.round(satAmt).toLocaleString()} 元保留現金</td></tr>`);
    $("calc").innerHTML = `<div class="scroll" style="max-height:none"><table><thead><tr><th>類別</th><th>標的</th><th>分配預算</th><th>收盤</th><th>整張</th><th>零股(股)</th><th>試算金額</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
      <div class="kpis" style="margin-top:10px">
        <div class="kpi"><span class="l">核心</span><b>${Math.round(coreAmt).toLocaleString()}</b><span class="d">${Math.round(coreR*100)}%</span></div>
        <div class="kpi"><span class="l">衛星（${picked.length} 檔）</span><b>${Math.round(satAmt).toLocaleString()}</b><span class="d">每檔 ${picked.length ? Math.round(satAmt/picked.length).toLocaleString() : 0}</span></div>
        <div class="kpi"><span class="l">試算投入</span><b>${Math.round(used).toLocaleString()}</b><span class="d">剩餘現金 ${Math.round(cap - used).toLocaleString()}</span></div>
      </div>
      <p class="mut" style="font-size:.72rem;margin-top:6px">※ 試算只是把資金依你設定的比例換算成股數，不代表建議買進；紀律提醒：等回檔、分批、不追高，⚠ 降級股嚴設停損。</p>`;
  };
  ["cap","coreR","odd"].forEach(id => $(id).addEventListener("input", calc));
  document.querySelectorAll(".pk").forEach(x => x.addEventListener("change", calc));
  calc();
}

// ── 手動篩選：與 Python rules/tw_garp.py 同一套規則 ─────
function manualForm() {
  const n = (id, label, v, step=1) => `<div><label>${label}</label><input id="${id}" type="number" step="${step}" value="${v}"></div>`;
  const s = (id, label, opts) => `<div><label>${label}</label><select id="${id}">${opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select></div>`;
  return `<div class="grid">
    ${n("mPe","本益比 PE",18,0.1)}${n("mG","EPS 年成長率 g (%)",25)}${n("mRoe","近四季 ROE (%)",22,0.1)}${n("mCore","本業占稅前 (%)",85)}
    ${n("mYoy","月營收 YoY (%)",11,0.1)}${s("mWeak","月營收連兩月轉弱？",[["no","否"],["yes","是"]])}${n("mDebt","負債比 (%)",55)}${n("mVol","日均量 (張)",2000,100)}
    ${s("mOcf","營業現金流 ≥ 淨利？",[["yes","是"],["no","否"]])}${s("mFcf","自由現金流 FCF",[["pos","為正"],["neg","為負"]])}
    ${s("mNd","淨負債水位",[["low","低/淨現金"],["high","偏高"]])}${s("mMoat","護城河等級",[["strong","有（不可取代技術）"],["normal","普通"],["gap","只是站在供需缺口"]])}
    ${s("mShort","缺貨漲價類？",[["no","否"],["yes","是"]])}${s("mFor","外資近 20 日",[["buy","買超"],["flat","持平"],["sell","賣超"]])}
    ${s("mFin","金融股？",[["no","否"],["yes","是（本業占比、負債比、現金流不適用）"]])}
  </div><button id="mBtn">篩選判定</button>`;
}
function runManual(C) {
  const g = id => $(id).value, f = id => parseFloat($(id).value);
  const pe = f("mPe"), gr = f("mG"), roe = f("mRoe"), core = f("mCore"), yoy = f("mYoy"), debt = f("mDebt"), vol = f("mVol");
  const fin = g("mFin") === "yes", shortage = g("mShort") === "yes", moat = g("mMoat"), down = shortage || moat === "gap";
  const pass = [], warn = [], fail = [];
  const P = (cond, ok, w, bad) => cond === "pass" ? pass.push(ok) : cond === "warn" ? warn.push(w) : fail.push(bad);
  if (!isNaN(pe)) P(pe <= C.pe.pass_max ? "pass" : pe <= C.pe.warn_max ? "warn" : "fail", `PE ${pe} ≤ ${C.pe.pass_max}（符合 GARP 便宜）`, `PE ${pe}（略高，需高成長支撐）`, `PE ${pe} > ${C.pe.warn_max}（偏貴，容錯小）`);
  if (!isNaN(pe) && gr > 0) { const peg = Math.round(pe / gr * 100) / 100; P(peg < C.peg.pass_max_exclusive ? "pass" : peg <= C.peg.warn_max ? "warn" : "fail", `PEG ${peg} < ${C.peg.pass_max_exclusive}（成長付得起估值）`, `PEG ${peg}（中性）`, `PEG ${peg} > ${C.peg.warn_max}（成長撐不起估值）`); }
  if (!isNaN(roe)) P(roe >= C.roe_4q.pass_min ? "pass" : roe >= C.roe_4q.warn_min ? "warn" : "fail", `ROE ${roe}% ≥ ${C.roe_4q.pass_min}（高獲利品質）`, `ROE ${roe}%（中等）`, `ROE ${roe}% 偏低`);
  if (!fin && !isNaN(core)) P(core >= C.core_ratio.pass_min ? "pass" : "fail", `本業占稅前 ${core}%（本業紮實）`, "", `本業占稅前 ${core}% < ${C.core_ratio.pass_min}（業外撐，排雷）`);
  if (g("mWeak") === "yes") fail.push("月營收連兩月 YoY 轉負（動能持續走弱，排雷）");
  else if (!isNaN(yoy)) P(yoy > C.revenue_yoy.pass_min_exclusive ? "pass" : "warn", `月營收 YoY +${yoy}%（動能正）`, `月營收 YoY ${yoy}%（單月轉弱，留意）`, "");
  if (!fin && !isNaN(debt)) P(debt <= C.debt_ratio.pass_max ? "pass" : debt <= C.debt_ratio.warn_max ? "warn" : "fail", `負債比 ${debt}%（可接受）`, `負債比 ${debt}%（偏高，留意利息）`, `負債比 ${debt}% 過高`);
  if (!fin) {
    g("mOcf") === "yes" ? pass.push("營業現金流 ≥ 淨利（獲利有現金含量）") : warn.push("營業現金流 < 淨利（現金含量偏弱）");
    if (g("mFcf") === "pos") pass.push("自由現金流為正");
    else if (g("mNd") === "high") fail.push("⚠ 自由現金流為負＋淨負債高（脆弱體質，淘汰賽高風險）");
    else warn.push("自由現金流為負（燒錢中，盯回收）");
  }
  if (!isNaN(vol)) P(vol >= C.avg_volume.pass_min ? "pass" : "warn", `日均量 ${vol} 張（流動性足）`, `日均量 ${vol} 張（偏低，進出用限價）`, "");
  const lvMap = {buy: C.foreign_buy_level || "pass", flat: C.foreign_flat_level || "none", sell: C.foreign_sell_level || "warn"};
  const ftxt = {buy:"外資買超（籌碼面加分）", flat:"外資持平", sell:"外資賣超（籌碼面扣分）"}[g("mFor")];
  const fl = lvMap[g("mFor")]; if (fl === "pass") pass.push(ftxt); else if (fl === "warn") warn.push(ftxt); else if (fl === "fail") fail.push(ftxt);
  if (moat === "strong") pass.push("有護城河（不可取代技術）"); else if (moat === "normal") warn.push("護城河普通");
  const V = C.verdict;
  const level = (fail.length >= V.red_fail_min || (down && fail.length >= V.red_if_shortage_and_fail)) ? "red"
    : (down || fail.length >= V.yellow_fail_min || warn.length >= V.yellow_warn_min) ? "yellow" : "green";
  const flags = down ? ["⚠ " + (shortage ? "缺貨漲價類" : "護城河只是站在供需缺口") + "：低 PE 可能是循環頂陷阱，僅波段/衛星、嚴設停損，勿當長期核心"] : [];
  const block = (arr, label, cls) => arr.length ? `<div style="margin-top:8px"><span class="${cls}">${label}</span><br>${arr.map(x => "• " + esc(x)).join("<br>")}</div>` : "";
  $("verdict").innerHTML = `<div class="verdict v-${level}"><b style="font-size:1rem">${LABELS[level]}</b>${block(pass,"✓ 符合：","g")}${block(warn,"△ 留意：","y")}${block(fail,"✗ 未過/排雷：","r")}${block(flags,"⚠ 旗標：","y")}<div class="mut" style="margin-top:10px;font-size:.72rem">※ 初步機械式判定，非投資建議。合格者仍須做基本面/技術面/籌碼面完整分析＋查證最新數據。</div></div>`;
}
</script>
